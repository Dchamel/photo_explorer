[package]
name = "photo_explorer"
version = "0.1.0"
edition = "2021"
description = "Быстрый и безопасный эксплорер фотографий для Windows 11"
license = "MIT"
repository = "https://github.com/dchamel/photo_explorer"
authors = ["dchamel <dchamel@yandex.ru>"]

[dependencies]
# Ядро
thiserror = "1"
# Сканер
walkdir = "2"
# Миниатюры
image = "0.25"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
