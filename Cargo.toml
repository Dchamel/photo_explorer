[package]
name = "photo_explorer"
version = "0.1.0"
edition = "2021"
description = "Быстрый и безопасный эксплорер фотографий для Windows 11"
license = "MIT"
repository = "https://github.com/dchamel/photo_explorer"
authors = ["dchamel <dchamel@yandex.ru>"]

[dependencies]
# Ядро
thiserror = "1"
# Сканер
walkdir = "2"
# Миниатюры
image = "0.25"
rayon = "1"
# Безопасность: хеширование PIN (кроссплатформенное)
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# Windows-специфика: только под Windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials_UI",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
