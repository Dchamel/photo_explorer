[package]
name = "photo_explorer"
version = "0.1.0"
edition = "2021"
description = "Быстрый и безопасный эксплорер фотографий для Windows 11"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/dchamel/photo_explorer"
authors = ["dchamel <dchamel@yandex.ru>"]
build = "build.rs"

[dependencies]
# Ядро
thiserror = "1"
# Логирование (фасад log + собственный логгер в src/logging.rs)
log = "0.4"
# Сканер
walkdir = "2"
# Миниатюры
image = "0.25"
rayon = "1"
# Безопасность: хеширование PIN (кроссплатформенное)
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
# Интерфейс
slint = { version = "1.8", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
# Системный диалог выбора папки
rfd = "0.14"
# LRU-кэш полных изображений в памяти (для быстрого viewer)
lru = "0.12"

# Windows-специфика: только под Windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
