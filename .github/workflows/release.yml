# Сборка релиза: по тегу v* собирает release .exe под Windows и публикует
# в GitHub Releases (справа в разделе Releases — exe для скачивания).
# Тег ставится вручную: git tag v0.2.0 && git push --tags.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # право создавать Release и прикладывать артефакты

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (ускоряет повторные сборки)
        uses: swatinem/rust-cache@v2

      - name: Сборка (release)
        run: cargo build --release

      - name: Тесты (релиз не публикуем, если тесты красные)
        run: cargo test --release

      - name: Подготовить артефакт + контрольная сумма (SHA-256)
        shell: bash
        run: |
          # Имя с версией из тега: photo_explorer_v0.3.0.exe
          TAG="${GITHUB_REF_NAME}"
          cp "target/release/photo_explorer.exe" "photo_explorer_${TAG}.exe"
          # 4.6-polish: SHA-256 рядом с exe — пользователь может сверить
          # целостность скачанного файла (см. README «SmartScreen»).
          certutil -hashfile "photo_explorer_${TAG}.exe" SHA256 \
            | sed -n '2p' | tr -d ' \r' > "photo_explorer_${TAG}.exe.sha256"
          echo "SHA-256: $(cat photo_explorer_${TAG}.exe.sha256)"
          ls -la photo_explorer_*.exe*

      - name: Создать GitHub Release с .exe + SHA-256
        uses: softprops/action-gh-release@v2
        with:
          files: |
            photo_explorer_*.exe
            photo_explorer_*.exe.sha256
          generate_release_notes: true
          body: |
            Photo Explorer для Windows 11.

            ## Что нового (v0.3.0)
            - ⚡ Ультра-скорость: тяжёлые фото декодируются на нескольких
              ядрах (SIMD + rayon) — галка в настройках, по умолчанию
              выключена (бережёт батарею ноутбука).
            - Приоритет текущего кадра: предзагрузка соседей больше не
              заставляет «размытое» висеть по 10 секунд.
            - Настройки: три вкладки (Листание / Производительность /
              Отладка), адаптивная панель.
            - 🧪 Отладка: детальная статистика декода в логах + кнопки
              доступа к логам из программы.
            - Иконка приложения (exe больше не «безликий»).

            ## Установка
            Скачай .exe и запусти. Сборка не требует установки.
            PIN-код, кэш и проекты хранятся локально в профиле пользователя.

            ## ⚠️ SmartScreen при первом запуске
            Windows покажет «Система Windows защитила ваш компьютер» —
            это нормально: у приложения нет платной цифровой подписи.
            Нажмите **«Подробнее» → «Выполнить в любом случае»**.
            Целостность файла можно сверить по `photo_explorer_v*.exe.sha256`
            (как — см. README, раздел «SmartScreen»).
